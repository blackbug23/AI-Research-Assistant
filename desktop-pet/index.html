<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面宠物</title>
    <link rel="stylesheet" href="assets/css/pet.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #f0f8ff, #e6f7ff);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s, transform 0.5s ease-out;
            -webkit-app-region: no-drag;
        }

        .loading-pet {
            width: 150px;
            height: 150px;
            background-color: #4CAF50;
            border-radius: 50%;
            animation: bounce 1s infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-text {
            position: absolute;
            bottom: 100px;
            color: #333;
            font-size: 18px;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }

        #pet-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
            z-index: 9999;
            /* 第二步：拖拽宠物 = 拖拽整个窗口 */
            -webkit-app-region: drag;
        }

        #pet-container:active {
            cursor: grabbing;
        }

        #pet {
            width: 150px;
            height: 150px;
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.3s, background-color 0.3s;
            margin: 10px auto 0;
        }

        #pet:hover {
            transform: scale(1.05);
            background-color: rgba(255, 255, 255, 0.25);
        }

        .pet-body {
            width: 120px;
            height: 120px;
            background-color: #4CAF50;
            border-radius: 50%;
            position: relative;
        }

        .pet-face {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            position: absolute;
            top: 20px;
            left: 20px;
            animation: breathing 2s infinite alternate;
        }

        .eye {
            width: 15px;
            height: 15px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
        }

        .eye-left {
            top: 25px;
            left: 20px;
        }

        .eye-right {
            top: 25px;
            right: 20px;
        }

        .mouth {
            width: 30px;
            height: 10px;
            background-color: black;
            border-radius: 10px;
            position: absolute;
            top: 50px;
            left: 25px;
            animation: smile 3s infinite alternate;
        }

        .ear {
            width: 25px;
            height: 35px;
            background-color: #4CAF50;
            position: absolute;
            top: -15px;
        }

        .ear-left {
            left: 25px;
            transform: rotate(-15deg);
        }

        .ear-right {
            right: 25px;
            transform: rotate(15deg);
        }

        #action-bubble {
            position: absolute;
            bottom: 170px;
            left: 0;
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #2196F3;
            border-radius: 15px;
            padding: 15px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: bubble-appear 0.5s ease-out;
            z-index: 10000;
            display: none;
            -webkit-app-region: no-drag;
        }

        .bubble-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .bubble-icon {
            font-size: 20px;
        }

        .bubble-title {
            color: #2196F3;
            font-weight: bold;
            font-size: 16px;
        }

        .bubble-content {
            margin-bottom: 15px;
            color: #333;
            font-size: 14px;
        }

        .bubble-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .bubble-btn {
            padding: 8px 15px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
            -webkit-app-region: no-drag;
        }

        .bubble-btn:hover {
            background-color: #1976D2;
        }

        .bubble-btn-secondary {
            background-color: #FF9800;
            -webkit-app-region: no-drag;
        }

        .bubble-btn-secondary:hover {
            background-color: #F57C00;
        }

        .bubble-btn-danger {
            background-color: #F44336;
            -webkit-app-region: no-drag;
        }

        .bubble-btn-danger:hover {
            background-color: #D32F2F;
        }

        #quick-location-bubble {
            position: absolute;
            bottom: 170px;
            right: 0;
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #FF9800;
            border-radius: 15px;
            padding: 15px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: bubble-appear 0.5s ease-out;
            z-index: 10000;
            display: none;
            -webkit-app-region: no-drag;
        }

        #reminder-bubble {
            position: absolute;
            bottom: 170px;
            left: 0;
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #F44336;
            border-radius: 15px;
            padding: 15px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: bubble-appear 0.5s ease-out;
            z-index: 10000;
            display: none;
            -webkit-app-region: no-drag;
        }

        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }

        .busy-animation {
            animation: rotate 1s linear infinite;
        }

        .congratulations-animation {
            animation: bounceCongrats 1s ease-in-out infinite;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounceCongrats {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }

        @keyframes breathing {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes smile {
            0% { width: 30px; height: 10px; }
            50% { width: 35px; height: 8px; }
            100% { width: 30px; height: 10px; }
        }

        @keyframes bubble-appear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 加载画面 -->
    <div id="loading-screen">
        <div class="loading-pet">
            <div class="pet-face">
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
                <div class="mouth"></div>
            </div>
        </div>
        <div class="loading-text">桌面宠物正在启动...</div>
    </div>

    <!-- 桌宠本体 -->
    <div id="pet-container">
        <div id="pet">
            <div class="pet-body">
                <div class="pet-face">
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                    <div class="mouth"></div>
                </div>
                <div class="ear ear-left"></div>
                <div class="ear ear-right"></div>
            </div>
        </div>

        <!-- 操作气泡 -->
        <div id="action-bubble">
            <div class="bubble-header">
                <div class="bubble-icon">⚙️</div>
                <div class="bubble-title">快捷操作</div>
            </div>
            <div id="action-content" class="bubble-content">
                点击选择要执行的操作
            </div>
            <div class="bubble-buttons">
                <button id="scan-action-btn" class="bubble-btn">扫码入库</button>
                <button id="eln-action-btn" class="bubble-btn-secondary">生成实验记录</button>
                <button id="close-action-btn" class="bubble-btn-danger">关闭</button>
            </div>
        </div>

        <!-- 快速位置填报气泡 -->
        <div id="quick-location-bubble">
            <div class="bubble-header">
                <div class="bubble-icon">📦</div>
                <div class="bubble-title">快速填报位置</div>
            </div>
            <div id="location-content" class="bubble-content"></div>
            <div class="bubble-buttons">
                <select id="location-select" style="-webkit-app-region: no-drag;">
                    <option value="仓库A-货架1">仓库A-货架1</option>
                    <option value="仓库A-货架2">仓库A-货架2</option>
                    <option value="仓库B-货架1">仓库B-货架1</option>
                    <option value="仓库B-货架2">仓库B-货架2</option>
                    <option value="实验室1-冰箱">实验室1-冰箱</option>
                    <option value="实验室2-冰箱">实验室2-冰箱</option>
                    <option value="试剂柜1-上层">试剂柜1-上层</option>
                    <option value="试剂柜1-下层">试剂柜1-下层</option>
                </select>
                <button id="submit-location-btn" class="bubble-btn">确认</button>
                <button id="cancel-location-btn" class="bubble-btn-danger">取消</button>
            </div>
        </div>

        <!-- 提醒气泡 -->
        <div id="reminder-bubble">
            <div class="bubble-header">
                <div class="bubble-icon">⚠️</div>
                <div class="bubble-title">位置提醒</div>
            </div>
            <div id="reminder-content" class="bubble-content"></div>
            <div class="bubble-buttons">
                <button id="record-location-btn" class="bubble-btn">记录位置</button>
                <button id="ignore-btn" class="bubble-btn-secondary">忽略</button>
            </div>
        </div>
    </div>

    <!-- PDF预览气泡 -->
    <div id="pdf-bubble" style="position: absolute; bottom: 220px; left: 0; background-color: rgba(255,255,255,0.95); border: 2px solid #4CAF50; border-radius: 15px; padding: 15px; width: 300px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); animation: bubble-appear 0.5s ease-out; z-index: 10000; display: none; -webkit-app-region: no-drag;">
        <div class="bubble-header">
            <div class="bubble-icon">📄</div>
            <div class="bubble-title">PDF生成成功</div>
        </div>
        <div id="pdf-content" class="bubble-content"></div>
        <div class="bubble-buttons">
            <button id="open-pdf-btn" class="bubble-btn">打开PDF</button>
            <button id="open-folder-btn" class="bubble-btn-secondary">打开文件夹</button>
            <button id="close-pdf-btn" class="bubble-btn-danger">关闭</button>
        </div>
    </div>

    <script>
        // 初始化 Electron API
        if (typeof require !== 'undefined') {
            const electron = require('electron');
            window.electron = electron;
        }

        // 初始化
        const petContainer = document.getElementById('pet-container');
        const pet = document.getElementById('pet');
        const loadingScreen = document.getElementById('loading-screen');
        
        // 加载完成后隐藏加载画面
        setTimeout(() => {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 300);
        }, 1000);
        
        // 右键点击宠物显示操作气泡
        pet.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showActionBubble();
            return false;
        });
        
        // 左键点击宠物（普通互动）
        pet.addEventListener('click', () => {
            pet.classList.add('shake-animation');
            setTimeout(() => {
                pet.classList.remove('shake-animation');
            }, 500);
        });
        
        // 显示操作气泡
        function showActionBubble() {
            const actionBubble = document.getElementById('action-bubble');
            actionBubble.style.display = 'block';
            // 其他气泡隐藏
            document.getElementById('quick-location-bubble').style.display = 'none';
            document.getElementById('reminder-bubble').style.display = 'none';
        }
        
        // 气泡按钮事件
        document.getElementById('scan-action-btn').addEventListener('click', () => {
            window.electron.ipcRenderer.sendSync('triggerQRScan');
            document.getElementById('action-bubble').style.display = 'none';
        });
        
        document.getElementById('eln-action-btn').addEventListener('click', () => {
            window.electron.ipcRenderer.sendSync('openGuide');
            document.getElementById('action-bubble').style.display = 'none';
        });
        
        document.getElementById('close-action-btn').addEventListener('click', () => {
            document.getElementById('action-bubble').style.display = 'none';
        });
        
        // IPC消息监听
        window.addEventListener('load', () => {
            window.api = {
                triggerPetAnimation: (goodsList) => {
                    pet.classList.add('shake-animation');
                    setTimeout(() => {
                        pet.classList.remove('shake-animation');
                    }, 500);
                    
                    const reminderBubble = document.getElementById('reminder-bubble');
                    const reminderContent = document.getElementById('reminder-content');
                    
                    const message = goodsList.map(g => `${g.goods_name} (${g.quantity})`).join(', ');
                    reminderContent.textContent = `发现 ${goodsList.length} 个未记录位置的商品：\\n${message}`;
                    reminderBubble.style.display = 'block';
                },
                
                showCongratulations: () => {
                    pet.classList.add('congratulations-animation');
                    setTimeout(() => {
                        pet.classList.remove('congratulations-animation');
                    }, 1500);
                    
                    const pdfBubble = document.getElementById('pdf-bubble');
                    const pdfContent = document.getElementById('pdf-content');
                    pdfContent.textContent = '实验记录已成功生成并归档！';
                    pdfBubble.style.display = 'block';
                },
                
                showLocationReminder: (goods) => {
                    const quickLocationBubble = document.getElementById('quick-location-bubble');
                    const locationContent = document.getElementById('location-content');
                    
                    locationContent.textContent = `商品 ${goods.goods_name} 入库后15分钟内未填报位置，请选择存放位置：`;
                    quickLocationBubble.style.display = 'block';
                },
                
                triggerQRScan: () => {
                    pet.classList.add('busy-animation');
                    setTimeout(() => {
                        pet.classList.remove('busy-animation');
                    }, 2000);
                },
                
                openGuide: () => {
                    // 打开实验记录向导窗口
                    console.log('打开实验记录向导');
                }
            };
            
            // 恢复宠物位置 - 窗口靠OS管理
        });
        
        // 气泡关闭事件
        document.getElementById('ignore-btn').addEventListener('click', () => {
            document.getElementById('reminder-bubble').style.display = 'none';
        });
        
        document.getElementById('record-location-btn').addEventListener('click', () => {
            document.getElementById('reminder-bubble').style.display = 'none';
            document.getElementById('quick-location-bubble').style.display = 'block';
        });
        
        document.getElementById('submit-location-btn').addEventListener('click', () => {
            const goodsId = prompt('请输入商品ID：');
            const location = document.getElementById('location-select').value;
            
            if (goodsId && location) {
                const result = window.electron.ipcRenderer.sendSync('update-storage-location', parseInt(goodsId), location);
                if (result.success) {
                    alert(result.message);
                }
            }
            document.getElementById('quick-location-bubble').style.display = 'none';
        });
        
        document.getElementById('cancel-location-btn').addEventListener('click', () => {
            document.getElementById('quick-location-bubble').style.display = 'none';
        });
        
        document.getElementById('open-pdf-btn').addEventListener('click', () => {
            // 打开PDF文件
            console.log('打开PDF预览');
        });
        
        document.getElementById('open-folder-btn').addEventListener('click', () => {
            window.electron.ipcRenderer.sendSync('openOutputFolder');
        });
        
        document.getElementById('close-pdf-btn').addEventListener('click', () => {
            document.getElementById('pdf-bubble').style.display = 'none';
        });
    </script>
</body>
</html>
