<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2196F3;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-input:focus {
            border-color: #2196F3;
            outline: none;
        }

        .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #2196F3;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1976D2;
        }

        .btn-secondary {
            background-color: #FF9800;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #F57C00;
        }

        .btn-danger {
            background-color: #F44336;
            color: white;
        }

        .btn-danger:hover {
            background-color: #D32F2F;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .status-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .success {
            text-align: center;
            padding: 20px;
            color: #4CAF50;
            font-weight: bold;
        }

        .failure {
            text-align: center;
            padding: 20px;
            color: #F44336;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">设置</title>

        <!-- LLM配置 -->
        <div class="form-group">
            <label class="form-label">LLM服务地址</label>
            <input type="text" class="form-input" id="llm-url" placeholder="http://localhost:8000">
        </div>

        <!-- 库存阈值 -->
        <div class="form-group">
            <label class="form-label">库存提醒阈值</label>
            <input type="number" class="form-input" id="inventory-threshold" placeholder="10" value="10">
        </div>

        <!-- 宠物动画速度 -->
        <div class="form-group">
            <label class="form-label">宠物动画速度</label>
            <select class="form-select" id="pet-animation-speed">
                <option value="slow">慢速</option>
                <option value="normal" selected>正常</option>
                <option value="fast">快速</option>
            </select>
        </div>

        <!-- 提醒间隔 -->
        <div class="form-group">
            <label class="form-label">位置提醒间隔（分钟）</label>
            <input type="number" class="form-input" id="reminder-interval" placeholder="15" value="15">
        </div>

        <!-- PDF输出路径 -->
        <div class="form-group">
            <label class="form-label">PDF输出路径</label>
            <input type="text" class="form-input" id="pdf-output-path" placeholder="./output">
        </div>

        <!-- 数据库配置 -->
        <div class="form-group">
            <label class="form-label">数据库路径</label>
            <input type="text" class="form-input" id="database-path" placeholder="./database.db">
        </div>

        <!-- 状态 -->
        <div id="status-container" class="status">
            <div id="status-content"></div>
        </div>

        <!-- 按钮 -->
        <div class="button-container">
            <button class="btn btn-primary" id="save-btn">保存设置</button>
            <button class="btn btn-secondary" id="refresh-btn">刷新设置</button>
            <button class="btn btn-danger" id="close-btn">关闭</button>
        </div>

        <!-- 加载/成功/失败 -->
        <div id="loading-section" class="loading" style="display: none;">
            正在保存设置...
        </div>

        <div id="success-section" class="success" style="display: none;">
            ✓ 设置保存成功！
        </div>

        <div id="failure-section" class="failure" style="display: none;">
            ✗ 设置保存失败
        </div>
    </div>

    <script>
        // 加载设置
        function loadSettings() {
            const loadingSection = document.getElementById('loading-section');
            loadingSection.style.display = 'block';
            
            try {
                const settings = window.electron.ipcRenderer.sendSync('load-settings');
                
                if (settings) {
                    document.getElementById('llm-url').value = settings.LLM_URL || 'http://localhost:8000';
                    document.getElementById('inventory-threshold').value = settings.INVENTORY_THRESHOLD || '10';
                    document.getElementById('pet-animation-speed').value = settings.PET_ANIMATION_SPEED || 'normal';
                    document.getElementById('reminder-interval').value = settings.REMINDER_INTERVAL || '15';
                    document.getElementById('pdf-output-path').value = settings.PDF_OUTPUT_PATH || './output';
                    document.getElementById('database-path').value = settings.DATABASE_PATH || './database.db';
                    
                    document.getElementById('status-content').textContent = '设置加载成功';
                } else {
                    document.getElementById('status-content').textContent = '未找到设置文件';
                }
            } catch (error) {
                document.getElementById('status-content').textContent = '加载设置失败';
            }
            
            loadingSection.style.display = 'none';
        }

        // 保存设置
        function saveSettings() {
            const settings = {
                LLM_URL: document.getElementById('llm-url').value,
                INVENTORY_THRESHOLD: document.getElementById('inventory-threshold').value,
                PET_ANIMATION_SPEED: document.getElementById('pet-animation-speed').value,
                REMINDER_INTERVAL: document.getElementById('reminder-interval').value,
                PDF_OUTPUT_PATH: document.getElementById('pdf-output-path').value,
                DATABASE_PATH: document.getElementById('database-path').value
            };
            
            const loadingSection = document.getElementById('loading-section');
            const successSection = document.getElementById('success-section');
            const failureSection = document.getElementById('failure-section');
            
            loadingSection.style.display = 'block';
            
            try {
                const result = window.electron.ipcRenderer.sendSync('save-settings', settings);
                
                if (result.success) {
                    loadingSection.style.display = 'none';
                    successSection.style.display = 'block';
                    document.getElementById('status-content').textContent = '设置保存成功';
                    
                    setTimeout(() => {
                        successSection.style.display = 'none';
                    }, 3000);
                } else {
                    loadingSection.style.display = 'none';
                    failureSection.style.display = 'block';
                    document.getElementById('status-content').textContent = '设置保存失败';
                }
            } catch (error) {
                loadingSection.style.display = 'none';
                failureSection.style.display = 'block';
                document.getElementById('status-content').textContent = '保存设置失败';
            }
        }

        // 按钮事件绑定
        document.getElementById('save-btn').addEventListener('click', saveSettings);
        document.getElementById('refresh-btn').addEventListener('click', loadSettings);
        document.getElementById('close-btn').addEventListener('click', () => {
            window.close();
        });

        // 初始化加载设置
        loadSettings();
    </script>
</body>
</html>
